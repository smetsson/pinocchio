<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1b1530" />
    <meta name="description" content="Pinocchio: a phone-first bluffing game about your colleagues." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pinocchio" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Pinocchio</title>

    <!-- Link previews (Teams, WhatsApp, Slack, iMessage…). Image: node scripts/make-og-image.mjs.
         These must be full web addresses: update them if the game ever moves. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pinocchio" />
    <meta property="og:title" content="Pinocchio 🤥 Join the game!" />
    <meta property="og:description" content="The bluffing game about your colleagues. Join on your phone: write believable lies, find the truth." />
    <meta property="og:url" content="https://smetsson.github.io/pinocchio/" />
    <meta property="og:image" content="https://smetsson.github.io/pinocchio/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pinocchio: the bluffing game about your colleagues" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pinocchio 🤥 Join the game!" />
    <meta name="twitter:description" content="The bluffing game about your colleagues. Join on your phone: write believable lies, find the truth." />
    <meta name="twitter:image" content="https://smetsson.github.io/pinocchio/og-image.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
